<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Planet Fitness Tracker</title>
<link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />
<link rel="icon" type="image/jpeg" href="assets/img/icon.jpeg" />
<link rel="apple-touch-icon" href="assets/img/icon.jpeg" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
<header>
<div class="wordmark">
<div class="brand-wrap">
  <img class="header-logo-img" src="assets/img/icon.jpeg" alt="Planet Fitness Logo" />
  <div class="logo">Planet <span>Fitness</span></div>
</div>
<div class="subtitle">3525 Washington St · Strength Plan</div>
<div class="week-session" id="week-session-display"></div>
<div id="global-progress-bar-container"></div>
</div>
<div class="header-actions">
<div style="display: flex; gap: 6px;">
  <button id="copy-btn">Copy Workout</button>
  <button class="reset-btn" id="recovery-btn" title="Recovery Stats">Stats</button>
</div>
<div style="display: flex; gap: 6px;">
  <div class="dropdown">
    <button class="reset-btn dropdown-trigger">Import ▾</button>
    <div class="dropdown-content">
      <button class="dropdown-item" id="import-template-btn">Import Template</button>
      <button class="dropdown-item" id="import-history-btn">Import History</button>
      <button class="dropdown-item" id="import-backup-btn">Import Backup</button>
    </div>
  </div>
  <div class="dropdown">
    <button class="reset-btn dropdown-trigger">Export ▾</button>
    <div class="dropdown-content">
      <button class="dropdown-item" id="export-template-btn">Export Template</button>
      <button class="dropdown-item" id="export-history-btn">Export History</button>
      <button class="dropdown-item" id="export-backup-btn">Export Backup</button>
    </div>
  </div>
</div>
<button class="reset-btn" id="reset-btn">Reset</button>
</div>
</header>
<!-- Rest Timer -->
<div class="hidden" id="rest-timer-bar">
<span id="rest-timer-label">REST</span>
<div id="rest-timer-track"><div id="rest-timer-fill"></div></div>
<span id="rest-timer-count">90</span>
<button id="rest-timer-extend" class="timer-action-btn" title="Add 30 seconds">+30s</button>
<button id="rest-timer-skip" class="timer-action-btn" title="Skip rest timer">✕</button>
</div>
<div id="app"></div>
<div class="log-hint" style="padding: 8px 0 80px; text-align: center;">
  TAP set to toggle · HOLD to log weight &amp; reps
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
